<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Maker Catalog</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --accent: #38bdf8;
        --accent-soft: #0ea5e9;
        --border: #1e293b;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: linear-gradient(180deg, #020617, #0f172a);
        color: var(--text);
      }

      header {
        padding: 3rem 1.5rem 2rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      header h1 {
        font-size: 2.6rem;
        font-weight: 700;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }

      header h1::after {
        content: "";
        display: block;
        width: 72px;
        height: 3px;
        background: var(--accent);
        margin-top: 0.6rem;
        border-radius: 2px;
      }

      header p {
        color: var(--muted);
        max-width: 720px;
      }

      .filters {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.5rem;
        flex-wrap: wrap;
      }

      .filter-btn {
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.85rem;
      }

      .filter-btn.active,
      .filter-btn:hover {
        color: var(--text);
        border-color: var(--accent);
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1rem 1.5rem 4rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.5rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
      }

      .card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        object-position: center;
        background-color: #fff;
        display: block;
      }

      .card-content {
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        flex-grow: 1;
      }

      .card h3 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 500;
      }

      .meta {
        font-size: 0.8rem;
        color: var(--muted);
      }

      .desc {
        font-size: 0.85rem;
        color: #cbd5f5;
      }

      .card button {
        margin-top: auto;
        padding: 0.6rem;
        border-radius: 10px;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-soft));
        color: #020617;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .card button.disabled {
        background: #1e293b;
        color: var(--muted);
        cursor: not-allowed;
        opacity: 0.8;
      }

      .cart {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        width: 320px;
        max-height: 70vh;
        display: flex;
        flex-direction: column;
      }

      .cart-header {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }

      .cart.collapsed #cart-toggle-icon {
        transform: rotate(-90deg);
      }

      #cart-toggle-icon {
        transition: transform 0.2s ease;
      }

      .cart-body {
        padding: 0.75rem 1rem;
        overflow-y: auto;
      }

      .cart.collapsed .cart-body {
        display: none;
      }

      @media (max-width: 600px) {
        .cart {
          right: 1rem;
          left: 1rem;
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>My Maker Catalog</h1>
      <p>
        Things I make by hand for friends and family. Sewing and 3D printing
        projects you can request. Since I can purchase any fabric or filament for
        my printer, let me know in the request notes if you envision a certain
        color, pattern, size, or fabric, and I'll do my best to create it.
      </p>
      <div class="filters">
        <button class="filter-btn active" onclick="filterItems('all', this)">
          All
        </button>
        <button class="filter-btn" onclick="filterItems('sewing', this)">
          Sewing
        </button>
        <button class="filter-btn" onclick="filterItems('3d', this)">
          3D Printing
        </button>
      </div>
    </header>

    <!-- content unchanged except typo fixes -->

  </body>
</html>
